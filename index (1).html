<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>택티컬 스윕 3D</title>
<style>
:root{--bg:#e9ecf1;--fg:#14171c;--pn:rgba(255,255,255,.88);--ac:#d9480f;--ab:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--fg:#f1f3f6;--pn:rgba(20,22,28,.88);--ac:#ffa94d;--ab:#1a1206}}
:root[data-theme="dark"]{--bg:#0d0f13;--fg:#f1f3f6;--pn:rgba(20,22,28,.88);--ac:#ffa94d;--ab:#1a1206}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;display:block}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none;font-weight:700;font-size:13px}
#hud .hud-meta{background:var(--pn);color:var(--fg);padding:5px 10px;border-radius:10px;opacity:.82;backdrop-filter:blur(6px)}
#hpPanel{background:var(--pn);color:var(--fg);padding:8px 12px;border-radius:12px;min-width:168px;box-shadow:0 4px 14px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.16)}
.hp-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.hp-label{font-size:11px;letter-spacing:.6px;opacity:.75}
.hp-num{font-size:18px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hp-track{width:100%;height:10px;border-radius:999px;background:rgba(128,128,128,.28);overflow:hidden;position:relative}
.hp-fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#2ecc71,#5cff7a);transition:width .16s ease,background .2s ease}
.hp-fill.mid{background:linear-gradient(90deg,#f59f00,#ffd43b)}
.hp-fill.low{background:linear-gradient(90deg,#e03131,#ff6b6b)}
#ammoPanel{background:var(--pn);color:var(--fg);padding:8px 12px;border-radius:12px;min-width:176px;box-shadow:0 4px 14px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.16)}
.am-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.am-wep{font-size:12px;font-weight:800;color:var(--ac)}
.am-num{font-size:18px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.am-res{font-size:12px;opacity:.72;font-weight:700}
.am-pips{display:grid;gap:3px;margin-top:4px;max-width:190px}
.am-pip{height:7px;border-radius:2px;background:var(--ac);box-shadow:0 0 6px rgba(255,169,77,.35);transition:transform .08s ease,opacity .12s ease}
.am-pip.empty{background:rgba(128,128,128,.25);box-shadow:none}
.am-reloading{font-size:12px;font-weight:900;color:#ffa94d;padding:4px 0}
#xh{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-9px 0 0 -9px;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
#xh.h{border-color:#ff4d4d;transform:scale(1.5)}
#dv{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px rgba(220,0,0,.85);opacity:0}
#js,#jk{position:fixed;display:none;border-radius:50%;pointer-events:none;border:2px solid rgba(255,255,255,.45)}
#js{width:90px;height:90px;margin:-45px 0 0 -45px}
#jk{width:36px;height:36px;margin:-18px 0 0 -18px;background:rgba(255,255,255,.3)}
#ov{
  position:absolute;inset:0;z-index:40;
  display:flex;flex-direction:row;align-items:stretch;justify-content:space-between;
  padding:calc(24px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(32px + env(safe-area-inset-left,0px));
  background:
    radial-gradient(circle at 75% 35%, rgba(255,106,42,.18), transparent 48%),
    radial-gradient(circle at 20% 80%, rgba(56,214,255,.10), transparent 50%),
    linear-gradient(125deg, #050608 0%, #0b0e14 55%, #121722 100%);
  color:#f3f5f8;overflow:auto;text-align:left;gap:24px;
}
#ov::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:36px 36px;
}
#ov[hidden]{display:none}
.menu-left{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-start;min-width:250px;max-width:320px;gap:22px}
.game-brand{border-left:4px solid #ff6a2a;padding-left:14px}
.game-sub{font-size:11px;font-weight:800;letter-spacing:3px;color:#ff8c42;text-transform:uppercase;margin-bottom:4px}
h1{margin:0;font-size:32px;font-weight:900;letter-spacing:-.5px;color:#fff;text-shadow:0 4px 20px rgba(255,106,42,.35)}
.nav-list{display:flex;flex-direction:column;gap:10px;width:100%}
.nav-item{
  width:100%;text-align:left;padding:14px 18px;border-radius:10px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
  color:#d8dee9;font-size:18px;font-weight:900;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:space-between;
  transition:all .16s ease;
}
.nav-item:hover,.nav-item.active{
  background:linear-gradient(90deg, rgba(255,106,42,.26), rgba(255,106,42,.06));
  border-color:#ff6a2a;color:#fff;transform:translateX(6px);
  box-shadow:0 6px 20px rgba(0,0,0,.45);
}
.nav-item .nav-tag{font-size:11px;font-weight:700;opacity:.7;letter-spacing:1px}
.menu-profile-pill{
  margin-top:auto;display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:800;color:#e5e9f0;
}
.prof-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex-shrink:0}
.menu-right{
  position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;
  min-width:280px;
}
.tab-pane{
  display:none;flex-direction:column;gap:14px;width:100%;max-width:440px;
  background:rgba(15,19,27,.84);border:1px solid rgba(255,255,255,.14);
  border-radius:16px;padding:22px;box-shadow:0 16px 40px rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
}
.tab-pane.active{display:flex}
.pane-title{font-size:18px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px}
.pane-desc{font-size:12.5px;line-height:1.55;color:#9aa5b4;margin:0}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:14px;border-radius:12px;background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.16);color:#fff;text-align:left;
}
.mode-btn.primary{background:linear-gradient(135deg,#ff6a2a,#d9480f);border-color:#ff922b}
.mode-btn b{font-size:15px}
.mode-btn span{font-size:11.5px;opacity:.85;font-weight:600}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:13.5px;font-weight:700;color:#e5e9f0}
p{margin:0;font-size:14px;line-height:1.6;max-width:360px}
button{font:inherit;font-weight:700;color:var(--ab);background:var(--ac);border:0;border-radius:12px;padding:11px 24px;touch-action:none;cursor:pointer}
@media (max-width:680px){
  #ov{flex-direction:column;justify-content:flex-start;padding:18px;gap:14px}
  .menu-left{max-width:none;min-width:0;gap:12px}
  .nav-list{flex-direction:row;gap:8px}
  .nav-item{padding:10px 12px;font-size:15px;justify-content:center}
  .nav-item .nav-tag,.menu-profile-pill{display:none}
  .menu-right{align-items:flex-start}
}
#bt{display:none;position:fixed;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px)) 0;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#bt div{display:flex;gap:10px}
#bt button{width:56px;height:56px;border-radius:50%;padding:0;pointer-events:auto;font-size:12px}
#bt #bf{width:76px;height:76px;font-size:15px}
@media (pointer:coarse){#bt{display:flex}#bf2{display:block}}
#tip{position:absolute;left:50%;top:32%;transform:translateX(-50%);background:var(--pn);color:var(--fg);padding:8px 16px;border-radius:10px;font-weight:700;font-size:20px;pointer-events:none}
#sb{position:absolute;top:148px;right:8px;background:var(--pn);color:var(--fg);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;pointer-events:none}
#tip:empty,#sb:empty{display:none}
#chs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#ov .card{background:rgba(255,255,255,.04);color:#d8dee9;border:1.5px solid rgba(255,255,255,.22);opacity:.72;padding:8px 10px;font-size:12px;font-weight:600;text-align:center;border-radius:10px;line-height:1.5}
#ov .card.on{opacity:1;border-color:#ff6a2a;background:rgba(255,106,42,.18);color:#fff}
#sk{position:fixed;right:14px;bottom:calc(210px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
#sk button{width:56px;height:56px;border-radius:50%;padding:0;font-size:11px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);color:rgba(255,255,255,.9);text-shadow:0 1px 3px #000}
#sk button:active{background:rgba(255,255,255,.3)}
#sd{position:absolute;inset:0;pointer-events:none;transition:box-shadow .2s}
#bt button,#bf2{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);color:rgba(255,255,255,.9);text-shadow:0 1px 3px #000;opacity:1;font-size:12px}
#bt button:active,#bf2:active{background:rgba(255,255,255,.3)}
#hud span,#sb{opacity:.75}
#fsb{position:absolute;left:8px;top:44px;width:34px;height:34px;padding:0;font-size:16px;border-radius:10px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);color:rgba(255,255,255,.9);text-shadow:0 1px 3px #000;opacity:.7}
#bf2{display:none;position:fixed;left:14px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;padding:0;opacity:.85}
#ov label{font-size:14px;display:flex;gap:8px;align-items:center}
#rdr{inset:auto;top:44px;right:8px;width:96px;height:96px;pointer-events:none;border-radius:50%;box-shadow:0 0 0 2px var(--ac)}
#pop{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:26px;letter-spacing:1px;color:var(--ac);text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
#ov .sub{background:rgba(255,255,255,.06);color:#fff;border:1.5px solid #ff6a2a}
#mpbox{display:none;flex-direction:column;gap:8px;padding:12px;border:1.5px solid #ff6a2a;border-radius:12px;background:rgba(255,106,42,.08)}
#mpbox.on{display:flex}
#rcode{font-size:18px;font-weight:900;padding:8px 12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;width:120px;text-align:center;text-transform:uppercase;letter-spacing:3px}
#roomtag{position:absolute;top:44px;left:50px;background:var(--pn);color:var(--ac);padding:5px 10px;border-radius:8px;font-weight:900;font-size:13px;pointer-events:none;display:none}

#editBtn{position:absolute;left:8px;top:84px;height:34px;padding:0 10px;font-size:12px;border-radius:10px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);color:rgba(255,255,255,.95);text-shadow:0 1px 3px #000;opacity:.85;z-index:20}
#editBar{display:none;position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;background:var(--pn);color:var(--fg);border:2px solid var(--ac);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:94vw}
#editBar.on{display:flex}
#editBar .eb-title{font-weight:900;font-size:13px;color:var(--ac)}
#editBar button{padding:7px 12px;font-size:12px;border-radius:9px}
#editBar .eb-ghost{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.hud-edit-target{outline:2px dashed #ffd34d !important;outline-offset:3px;cursor:grab !important;touch-action:none !important;opacity:1 !important}
.hud-edit-target.dragging{outline:2px solid var(--ac) !important;background:rgba(255,169,77,.35) !important;cursor:grabbing !important;transform:scale(1.06)}


#rlBadge{display:none;position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pn);color:var(--fg);border:2px solid var(--ac);border-radius:999px;padding:7px 16px;font-weight:900;font-size:13px;letter-spacing:.3px;box-shadow:0 6px 18px rgba(0,0,0,.32);pointer-events:none;z-index:25;gap:8px;align-items:center}
#rlBadge.on{display:flex;animation:rlPulse .55s ease-in-out infinite alternate}
#rlBadge .rl-dot{width:9px;height:9px;border-radius:50%;background:var(--ac)}
@keyframes rlPulse{from{transform:translateX(-50%) scale(.98)}to{transform:translateX(-50%) scale(1.04)}}





#rotBtn{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));height:36px;padding:0 12px;font-size:12px;border-radius:10px;background:rgba(255,106,42,.22);border:1.5px solid #ff8c42;color:#fff;text-shadow:0 1px 3px #000;opacity:.95;z-index:65}


#nickInp{font:inherit;font-weight:800;font-size:15px;padding:9px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;width:100%;box-sizing:border-box;text-align:center}
#colGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
.col-sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.45);cursor:pointer;padding:0;transition:transform .12s ease,box-shadow .12s ease}
.col-sw.on{transform:scale(1.18);border:3px solid #fff;box-shadow:0 0 0 2px var(--ac)}
.name-tag{position:fixed;transform:translate(-50%,-100%);background:rgba(13,15,19,.78);color:#fff;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none;border:1px solid rgba(255,255,255,.22);z-index:18;text-shadow:0 1px 2px #000}

</style></head><body><div id="app">
<div id="hud">
  <div id="hpPanel">
    <div class="hp-top"><span class="hp-label">♥ 체력</span><span id="hpNum" class="hp-num">100</span></div>
    <div class="hp-track"><div id="hpBar" class="hp-fill"></div></div>
  </div>
  <div id="ammoPanel">
    <div class="am-top"><span id="amWep" class="am-wep">돌격소총</span><div><span id="amCur" class="am-num">30</span> <span id="amRes" class="am-res">/ 90</span></div></div>
    <div id="amPips" class="am-pips"></div>
  </div>
  <span id="kl" class="hud-meta"></span>
  <span id="rd" class="hud-meta"></span>
</div>
<div id="roomtag"></div><div id="nameTags"></div>
<div id="xh"></div><canvas id="rdr"></canvas><button id="fsb">⛶</button><button id="editBtn">버튼 배치</button><button id="rotBtn">가로 전환</button><div id="pop"></div><div id="tip"></div><div id="rlBadge"><span class="rl-dot"></span><span id="rlText">재장전 중…</span></div><div id="sb"></div><div id="dv"></div><div id="js"></div><div id="jk"></div>
<div id="bt"><div><button id="bw">무기</button><button id="ba">조준</button><button id="bj">점프</button><button id="br">재장전</button></div><button id="bf">발사</button></div>
<div id="sk"><button id="s0"></button><button id="s1"></button><button id="s2"></button></div><div id="sd"></div><button id="bf2">발사</button>
<div id="editBar">
  <span class="eb-title">버튼 위치 편집 (드래그해서 이동)</span>
  <button id="editReset" class="eb-ghost">기본 위치</button>
  <button id="editDone">완료</button>
</div>
<div id="ov">
  <div class="menu-left">
    <div class="game-brand">
      <div class="game-sub">TACTICAL FPS</div>
      <h1>택티컬 스윕 3D</h1>
    </div>
    <div class="nav-list">
      <button type="button" class="nav-item active" data-tab="play"><span>▶ 플레이</span><span class="nav-tag">PLAY</span></button>
      <button type="button" class="nav-item" data-tab="settings"><span>⚙ 설정</span><span class="nav-tag">OPTION</span></button>
      <button type="button" class="nav-item" data-tab="profile"><span>◈ 닉네임</span><span class="nav-tag">PROFILE</span></button>
    </div>
    <div class="menu-profile-pill">
      <span id="profDot" class="prof-dot" style="background:#e03131"></span>
      <span id="profPreview">플레이어</span>
    </div>
  </div>

  <div class="menu-right">
    <!-- 플레이 탭 -->
    <div id="pane-play" class="tab-pane active">
      <div class="pane-title"><span>출격 모드 & 클래스</span></div>
      <p id="msg" class="pane-desc">적을 모두 소탕하세요. 머리를 맞히면 즉사입니다.<br>PC: WASD 이동 · 마우스 조준 · R 재장전 · Q/E/F 스킬</p>
      <div id="chs"></div>
      <div class="mode-cards">
        <button type="button" id="go" class="mode-btn primary">
          <b>일반플레이</b>
          <span>AI 적 소탕 라운드전</span>
        </button>
        <button type="button" id="gm" class="mode-btn">
          <b>멀티플레이</b>
          <span>방 코드로 친구와 대전</span>
        </button>
      </div>
      <div id="mpbox">
        <div style="font-weight:800;font-size:13px;color:#ffa94d">실시간 멀티플레이 (방 코드 공유)</div>
        <div class="row">
          <button type="button" id="mkroom">방 만들기</button>
          <input id="rcode" maxlength="4" placeholder="코드4자">
          <button type="button" id="jnroom" class="sub">방 참가</button>
        </div>
      </div>
    </div>

    <!-- 설정 탭 -->
    <div id="pane-settings" class="tab-pane">
      <div class="pane-title"><span>게임 & 조작 설정</span></div>
      <label class="set-row">
        <span>자동사격 (조준 시 발사)</span>
        <input type="checkbox" id="au">
      </label>
      <div class="set-row">
        <span>조작 버튼 위치 커스텀</span>
        <button type="button" id="openLayoutBtn" class="sub" style="padding:7px 14px;font-size:12px">버튼 배치 편집</button>
      </div>
      <label class="set-row">
        <span>조준 감도</span>
        <input type="range" id="sn" min=".5" max="2" step=".1" value="1">
      </label>
      <label class="set-row">
        <span>버튼 투명도</span>
        <input type="range" id="bo" min=".15" max="1" step=".05" value=".7">
      </label>
      <div class="row" style="justify-content:flex-end">
        <button type="button" id="fs" class="sub" style="padding:8px 16px;font-size:13px">전체화면 전환</button>
      </div>
    </div>

    <!-- 닉네임 & 색깔 탭 -->
    <div id="pane-profile" class="tab-pane">
      <div class="pane-title"><span>닉네임 & 캐릭터 색상</span></div>
      <p class="pane-desc">멀티플레이 시 머리 위에 닉네임이 표시되고, 선택한 색상으로 캐릭터 복장이 적용됩니다.</p>
      <input id="nickInp" maxlength="12" placeholder="플레이어">
      <div id="colGrid" style="max-width:none"></div>
    </div>
  </div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const hueOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};

function makeCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.random()*c.length|0];return s}

function mpSend(data,except){
  const pkt={...data,id:peer?peer.id:''};
  for(const id in conns){
    if(id===except)continue;
    const c=conns[id];
    if(c&&c.open)try{c.send(pkt)}catch(_){}
  }
}

function handleMsg(fromId,d){
  if(!d||!d.t)return;
  const sender=d.id||fromId;
  if(sender===peer?.id)return;
  if(isHost)mpSend(d,fromId);

  if(d.t==='state'){
    let r=rp[sender];
    if(!r){
      const colHex=(+d.col)>0?(+d.col):0x228be6;
      const c=mkChar([colHex,0x2b2b30,0xd9a77c,0x1d1d21]);
      applyCharColor(c,colHex);
      const tagEl=document.createElement('div');
      tagEl.className='name-tag';
      tagEl.textContent=(typeof d.nick==='string'&&d.nick.trim())?d.nick.trim().slice(0,12):'플레이어';
      $('nameTags').appendChild(tagEl);
      r=rp[sender]={...c,peer:sender,rem:1,x:0,y:0,z:0,yaw:0,tx:0,ty:0,tz:0,tyaw:0,ph:0,fl:0,al:1,k:0,d:0,t:0,hue:hueOf(sender),init:0,clk:0,colHex,nick:tagEl.textContent,tagEl};
      c.g.traverse(m=>{if(m.isMesh)m.userData.e=r});
      sc.add(c.g);
      pop(r.nick+' 입장!');
    }
    r.tx=d.x;r.ty=d.y;r.tz=d.z;r.tyaw=d.yaw;
    if(!r.init){r.init=1;r.x=r.tx;r.y=r.ty;r.z=r.tz;r.yaw=r.tyaw}
    if(typeof d.nick==='string'&&d.nick.trim()){
      const nn=d.nick.trim().slice(0,12);
      if(r.nick!==nn){r.nick=nn;if(r.tagEl)r.tagEl.textContent=nn}
    }
    if((+d.col)>0 && r.colHex!==(+d.col)){
      r.colHex=(+d.col);
      applyCharColor(r,r.colHex);
    }
    r.k=d.k|0;r.d=d.d|0;r.clk=d.clk?1:0;
    const was=r.al;r.al=d.al?1:0;
    if(!was&&r.al){r.g.rotation.x=0;r.g.visible=true;r.x=r.tx;r.y=r.ty;r.z=r.tz}
    if(was&&!r.al)r.t=0;
  }
  else if(d.t==='shot'){
    const r=rp[sender];
    if(r&&r.al&&Array.isArray(d.ep)){
      tracer(new THREE.Vector3(r.x,r.y+1.3,r.z),new THREE.Vector3(d.ep[0],d.ep[1],d.ep[2]),0x7ac8ff);
      SX.shot(Math.min(.6,5/(Math.hypot(r.x-pl.x,r.z-pl.z)||1)));
    }
  }
  else if(d.t==='hit'){
    if(d.to===peer?.id)hitMe(d.dmg,sender,d.hd);
  }
  else if(d.t==='kill'){
    if(d.to===peer?.id){kills++;SX.kill();pop(d.hd?'헤드샷 킬!':'처치!')}
  }
}

function bindConn(conn){
  conns[conn.peer]=conn;
  const onOpen=()=>{
    conns[conn.peer]=conn;
    sendState(true);
  };
  if(conn.open)onOpen();
  conn.on('open',onOpen);
  conn.on('data',d=>handleMsg(conn.peer,d));
  const dropConn=()=>{
    delete conns[conn.peer];
    if(rp[conn.peer]){sc.remove(rp[conn.peer].g);if(rp[conn.peer].tagEl)rp[conn.peer].tagEl.remove();delete rp[conn.peer];pop('플레이어 퇴장')}
  };
  conn.on('close',dropConn);
  conn.on('error',dropConn);
}

async function startMultiGame(code,host){
  mm=1;isHost=host;roomCode=code;dth=0;
  reset();st=1;
  if(LO){if(!document.fullscreenElement)fsT(1);await forceLandscape();checkOrientationHint()}
  $('ov').hidden=true;
  $('roomtag').style.display='block';
  $('roomtag').textContent='방 코드: '+code;
  pop(host?'방 생성 완료! 코드: '+code:'방 ['+code+'] 접속 성공!');
  if(!matchMedia('(pointer:coarse)').matches)lock();
}

  aud();

  mpStop();

  const el=$(id);if(!el)return;
  el.addEventListener('pointerdown',e=>{
    if(!layoutMode)return;
    e.preventDefault();
    e.stopPropagation();
    const r=el.getBoundingClientRect();
    el.style.position='fixed';
    el.style.left=r.left+'px';
    el.style.top=r.top+'px';
    el.style.right='auto';
    el.style.bottom='auto';
    el.style.margin='0';
    el.classList.add('dragging');
    dragState={
      el,
      id,
      offsetX:e.clientX-r.left,
      offsetY:e.clientY-r.top,
      w:r.width,
      h:r.height
    };
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  },true);
});

addEventListener('pointermove',e=>{
  if(!layoutMode||!dragState)return;
  e.preventDefault();
  const maxX=Math.max(0,innerWidth-dragState.w);
  const maxY=Math.max(0,innerHeight-dragState.h);
  const nx=Math.max(0,Math.min(maxX,e.clientX-dragState.offsetX));
  const ny=Math.max(0,Math.min(maxY,e.clientY-dragState.offsetY));
  dragState.el.style.left=nx+'px';
  dragState.el.style.top=ny+'px';
  savedLayout[dragState.id]={left:Math.round(nx),top:Math.round(ny)};
},true);

addEventListener('pointerup',e=>{
  if(!layoutMode||!dragState)return;
  e.preventDefault();
  dragState.el.classList.remove('dragging');
  saveLayout();
  dragState=null;
},true);

addEventListener('resize',()=>{
  for(const id of EDITABLE_IDS){
    const pos=savedLayout[id],el=$(id);
    if(!pos||!el)continue;
    const r=el.getBoundingClientRect();
    const w=r.width||56,h=r.height||56;
    const nx=Math.max(0,Math.min(Math.max(0,innerWidth-w),pos.left));
    const ny=Math.max(0,Math.min(Math.max(0,innerHeight-h),pos.top));
    savedLayout[id]={left:Math.round(nx),top:Math.round(ny)};
    el.style.left=savedLayout[id].left+'px';
    el.style.top=savedLayout[id].top+'px';
  }
  saveLayout();
});

applySavedLayout();
